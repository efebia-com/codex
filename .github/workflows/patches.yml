# Checks the patch series when they change: they must apply on the upstream tag
# they were generated against (patches/base) and on the newest stable upstream
# release, and the extension tests must pass on the base tag.

name: patches

on:
  pull_request:
    paths: ["patches/**", "scripts/**", ".github/workflows/patches.yml"]
  push:
    branches: [main]
    paths: ["patches/**", "scripts/**", ".github/workflows/patches.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  SOURCE_DIR: ${{ github.workspace }}/.work/src

jobs:
  apply-latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Apply the patches on the newest stable upstream release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/prepare-source.sh --skip-lock "$(scripts/upstream-latest.sh)" "$SOURCE_DIR"

  test-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read the base tag
        id: base
        run: echo "tag=$(sed -e 's/#.*//' patches/base | awk 'NF { print; exit }')" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/free-disk-space
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-rust
        with:
          upstream-tag: ${{ steps.base.outputs.tag }}
      - name: Prepare source
        run: scripts/prepare-source.sh "${{ steps.base.outputs.tag }}" "$SOURCE_DIR"
      - name: Fetch the Codex-built V8 (checksums verified)
        run: scripts/fetch-v8.sh --source "$SOURCE_DIR" --target x86_64-unknown-linux-gnu --cache "${RUNNER_TEMP}/rusty_v8" >>"$GITHUB_ENV"
      - name: Add swap for the test build
        # The runner has 16 GB and was shut down while compiling the largest test
        # crates. The swap file goes on the scratch disk on /mnt when there is one.
        run: |
          swapfile=/mnt/swapfile
          if ! mountpoint -q /mnt; then swapfile=/swapfile.tests; fi
          sudo swapoff -a
          sudo rm -f "$swapfile"
          sudo fallocate -l 16G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
      - name: Keep the runner out of the OOM killer
        # Under memory pressure the kernel must kill a build or test process, not the
        # runner: a killed runner loses the job and its log.
        run: |
          for pid in $(pgrep -f 'Runner\.(Listener|Worker)'); do
            echo -1000 | sudo tee "/proc/${pid}/oom_score_adj" >/dev/null
          done
          if systemctl is-active --quiet systemd-oomd; then sudo systemctl stop systemd-oomd; fi
          free -m
      - name: Run extension tests
        env:
          # Two rustc processes and two test threads at a time keep the job within memory.
          CARGO_BUILD_JOBS: "2"
          RUST_TEST_THREADS: "2"
        run: |
          echo 1000 >/proc/self/oom_score_adj
          (while sleep 60; do
            free -m | awk -v t="$(date -u +%T)" '/^Mem:/ { m = $7 } /^Swap:/ { s = $3 }
              END { printf "== %s memory: %s MB available, %s MB swap used\n", t, m, s }'
          done) &
          monitor=$!
          status=0
          # Its own session: a test that signals its process group cannot reach the runner.
          setsid --wait scripts/test-extensions.sh --source "$SOURCE_DIR" || status=$?
          kill "$monitor"
          exit "$status"
