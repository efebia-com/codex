# Build and publish a release on GitHub Actions, when run by hand.
#
# New upstream releases are built on a build machine by the scheduled
# scripts/release-scheduled.sh. This workflow makes the same release: the plan
# job checks for a stable upstream release that this repository has not
# published yet. If there is one, the patch series is applied, the extension
# tests run, Codex is built for every target, each package is installed with
# install.sh and smoke-tested, and only then the release is published. Any
# failure publishes nothing and opens an issue; the scheduled check does not
# retry that upstream version while the issue is open.
#
# Run it to retry, to build a given upstream tag, or (with force) to publish a
# new revision of an already published upstream version.

name: release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag, e.g. rust-v0.169.0 (default: newest stable)"
        required: false
        default: ""
      force:
        description: "Publish a new revision even if this upstream version is already published"
        type: boolean
        default: false
      targets:
        description: "Targets to build and publish, space or comma separated (default: all; only x86_64-unknown-linux-musl)"
        required: false
        default: "all"

# One release run at a time; a run that arrives meanwhile waits and then finds
# the release already published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # libgit2 stalls on the large submodules of the rusty_v8 git dependency.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_INCREMENTAL: "0"
  SOURCE_DIR: ${{ github.workspace }}/.work/src

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      version: ${{ steps.check.outputs.version }}
      linux: ${{ steps.targets.outputs.linux }}
      smoke: ${{ steps.targets.outputs.smoke }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check for an unpublished upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=("$GITHUB_REPOSITORY")
          if [[ -n "${INPUT_TAG:-}" ]]; then args+=(--tag "$INPUT_TAG"); fi
          if [[ "${INPUT_FORCE:-}" == "true" ]]; then args+=(--force); fi
          scripts/check-release.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      - name: Choose the targets
        id: targets
        env:
          # Releases are for Linux x86_64 only.
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          # runner: where the package is built (Linux) and smoke-tested.
          all='[
            {"target": "x86_64-unknown-linux-musl", "runner": "ubuntu-24.04", "os": "linux"}]'
          chosen="$(jq -c --arg want "$TARGETS" '
            ($want | [splits("[ ,]+")] | map(select(. != ""))) as $w
            | if $w == ["all"] then .
              elif ($w - map(.target)) != [] then error("unknown targets: \($w - map(.target))")
              else map(select(.target as $t | $w | index($t)))
              end' <<<"$all")"
          {
            echo "linux=$(jq -c '[.[] | select(.os == "linux") | {target, runner}]' <<<"$chosen")"
            echo "smoke=$(jq -c '[.[] | {target, runner}]' <<<"$chosen")"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Check that the patches apply
        if: steps.check.outputs.build == 'true'
        run: scripts/prepare-source.sh --skip-lock "${{ steps.check.outputs.upstream_tag }}" "$SOURCE_DIR"

  test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-rust
        with:
          upstream-tag: ${{ needs.plan.outputs.upstream_tag }}
      - name: Prepare source
        run: scripts/prepare-source.sh "${{ needs.plan.outputs.upstream_tag }}" "$SOURCE_DIR"
      - name: Fetch the Codex-built V8 (checksums verified)
        run: scripts/fetch-v8.sh --source "$SOURCE_DIR" --target "x86_64-unknown-linux-gnu" --cache "${RUNNER_TEMP}/rusty_v8" >>"$GITHUB_ENV"
      - name: Run extension tests
        run: scripts/test-extensions.sh --source "$SOURCE_DIR"

  build-linux:
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.linux != '[]'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # musl, as upstream releases, built natively.
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils pkg-config libcap-dev
      - uses: ./.github/actions/setup-rust
        with:
          upstream-tag: ${{ needs.plan.outputs.upstream_tag }}
          target: ${{ matrix.target }}
      - name: Use a hermetic Cargo home
        # As upstream: no runner Cargo configuration leaks into the musl build.
        run: |
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          : >"${cargo_home}/config.toml"
          echo "CARGO_HOME=${cargo_home}" >>"$GITHUB_ENV"
          echo "${cargo_home}/bin" >>"$GITHUB_PATH"
      - name: Prepare source
        run: scripts/prepare-source.sh "${{ needs.plan.outputs.upstream_tag }}" "$SOURCE_DIR"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        env:
          CODEX_MUSL_RELEASE_LINK_FLAGS: "1"
        run: bash "${SOURCE_DIR}/.github/scripts/install-musl-build-tools.sh"
      - name: Disable aws-lc jitter entropy
        # As upstream: avoids a problematic aws-lc code path on musl.
        run: |
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >>"$GITHUB_ENV"
          var="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          echo "${var}=1" >>"$GITHUB_ENV"
      - name: Add swap for the release links
        # The runner has 16 GB and was shut down while building the last, largest
        # crates. The swap file goes on the scratch disk on /mnt when there is one.
        run: |
          swapfile=/mnt/swapfile
          if ! mountpoint -q /mnt; then swapfile=/swapfile.release; fi
          sudo swapoff -a
          sudo rm -f "$swapfile"
          sudo fallocate -l 16G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
      - name: Fetch the Codex-built V8 (checksums verified)
        run: scripts/fetch-v8.sh --source "$SOURCE_DIR" --target "$TARGET" --cache "${RUNNER_TEMP}/rusty_v8" >>"$GITHUB_ENV"
      - name: Build
        env:
          CODEX_DISPLAY_VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/build.sh --release --target "$TARGET" --source "$SOURCE_DIR" --out "${RUNNER_TEMP}/package"
      - name: Package
        run: |
          scripts/package.sh --package "${RUNNER_TEMP}/package" --source "$SOURCE_DIR" \
            --version "${{ needs.plan.outputs.version }}" --target "$TARGET" --out-dir dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: [plan, build-linux]
    # The build job is skipped when none of its targets was chosen; any failure
    # still stops here.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.build == 'true' }}
    name: smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each package runs natively on its own platform.
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-${{ matrix.target }}
          path: dist
      - name: Install with install.sh and run the smoke tests
        run: scripts/smoke.sh --archive-dir dist --version "${{ needs.plan.outputs.version }}"

  publish:
    needs: [plan, test, build-linux, smoke]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/publish.sh "$GITHUB_REPOSITORY" "${{ needs.plan.outputs.version }}" \
            "${{ needs.plan.outputs.upstream_tag }}" dist "$GITHUB_SHA"

  report-failure:
    needs: [plan, test, build-linux, smoke, publish]
    # Only for runs that knew what they were building: a failure of the check
    # itself opens no issue.
    if: failure() && needs.plan.outputs.upstream_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Open or update the release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-failure.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${{ needs.plan.outputs.upstream_tag }}"
