name: macos-bash
description: Make bash 4 or newer the bash on PATH; macOS ships bash 3.2.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if ((BASH_VERSINFO[0] < 4)); then
          brew install bash
        fi
        bash -c 'echo "bash ${BASH_VERSION}"; ((BASH_VERSINFO[0] >= 4))'
